<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Car body -->
  <path d="M 10 55 L 17 42 L 30 28 L 50 20 L 70 28 L 83 42 L 90 55 L 90 70 L 83 78 L 17 78 L 10 70 Z" 
        fill="url(#carGradient)" stroke="#047857" stroke-width="2.5"/>
  
  <!-- Car window -->
  <path d="M 30 35 L 40 28 L 60 28 L 70 35 L 67 52 L 33 52 Z" 
        fill="#0f172a" opacity="0.8"/>
  
  <!-- Front wheel -->
  <circle cx="28" cy="78" r="12" fill="#1e293b" stroke="#047857" stroke-width="2.5"/>
  <circle cx="28" cy="78" r="6" fill="#374151"/>
  
  <!-- Back wheel -->
  <circle cx="72" cy="78" r="12" fill="#1e293b" stroke="#047857" stroke-width="2.5"/>
  <circle cx="72" cy="78" r="6" fill="#374151"/>
  
  <!-- Headlight -->
  <circle cx="87" cy="58" r="3.5" fill="#fbbf24"/>
  
  <!-- Detail line -->
  <line x1="17" y1="55" x2="83" y2="55" stroke="#047857" stroke-width="2"/>
</svg>
